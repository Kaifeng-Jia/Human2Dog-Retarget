# Candidate selection (spec §7.1 step 1), shared by both lines: scripts/common/push_candidates.py --selection and
# scripts/common/prepare_tasks.py --selection. Low objects the arm cannot reach are out.

# The contact targets live in the object frame, so object rotation during a segment is allowed (a 20 deg limit
# rejected most slid segments on tables, chairs and suitcases).
max_yaw_deg: 45

# Contact height [m] the Z1 can push with a level B2 (root 0.5 m, standing legs), per face class (normal tilt above
# the horizontal: side < 30 deg, top > 60 deg, slant otherwise). From a sampled IK workspace map: side faces are
# reachable at 0.5-1.2 m (0.5-1.0 m ahead of the base), top faces at 0.3-0.8 m (0.5-0.7 m ahead); nothing below
# 0.5 m on a side face (the upper arm hits the trunk).
reach_band:
  side: [0.5, 1.2]
  top: [0.3, 0.8]
  slant: [0.4, 1.2]
  grasp: [0.3, 1.2]    # a grasped handle / edge keeps its height; the gripper closes on it from the side or above

# push: the object moves away from the hand; pull: towards it (|cos| >= 0.7). A grasp (thumb and fingers on
# opposite sides of a part) is exempt from the one-flat-face criteria.
interactions: [push, pull]

# Only what the closed gripper can press (pushes, drags on a top face); side pulls need a grasp at the jaw site,
# which is not modelled.
grips: [press]
