# B2-Z1 for the full-optimization solver (fullopt spec v0.2 §7.4). The solver and the evaluation read the robot only
# through this file (h2d/fullopt/robot.py); a second robot (G1, spec §9) gets its own file.

name: b2z1
title: B2-Z1
model_xml: model_xml          # key in configs/b2z1.yaml `xmorph`, a path relative to $XMORPH_ROOT (one model file)

base_body: base_link
forward_axis: [1.0, 0.0, 0.0] # trunk frame axis that is the dog's heading
home_key: home                # legs (0, 0.8, -1.5) rad; the arm raised forward
# Trunk height with the legs at home and the soles on the floor: the keyframe's 0.58 m leaves them 3.7 cm up.
nominal_base_height_m: 0.5435
# Trunk heights the legs reach with the feet under the hips: down to a knee closed to ~65 deg (the X-Morph prior
# goes to 0.46 m on the dev pushes), up to the keyframe's height.
base_height_range_m: [0.40, 0.58]
tilt_limit_deg: 15             # |roll|, |pitch| of the trunk (the assumption of the grasp reach map, PR #41)
feet: {FL: FL_foot, FR: FR_foot, RL: RL_foot, RR: RR_foot}
foot_radius_m: 0.032          # sphere at the end of each calf

legs: [FL_hip_joint, FL_thigh_joint, FL_calf_joint, FR_hip_joint, FR_thigh_joint, FR_calf_joint,
       RL_hip_joint, RL_thigh_joint, RL_calf_joint, RR_hip_joint, RR_thigh_joint, RR_calf_joint]
arm: [joint1, joint2, joint3, joint4, joint5, joint6]
locked: {jointGripper: 0.0}   # closed; the contact point below is only valid here
# Trunk speed and acceleration per axis (translation: world x, y, z; rotation: trunk frame). Speeds: 1 m/s per
# horizontal axis (1.4 m/s diagonally) is about the walk / trot boundary (Froude 0.35: 1.37 m/s at this hip height);
# the dev people walk at 0.17-0.61 m/s (M0, R026b). Vertically 0.3 m/s: the whole height range in 0.6 s, where R027
# dropped 14 cm in 5 frames (40-45 m/s2) as the task gate opened. Turning 1 rad/s: above the human's trunk on the dev
# windows (shoulder line over 1 s: up to 0.7 rad/s). Accelerations: what the feet can push. Horizontally mu g with
# mu = 0.5 (rubber on a floor): 5 m/s2; about the yaw axis mu m g r / I_zz: 0.5 x 60 kg x 9.81 x 0.38 m (feet from the
# centre) / ~7 kg m2 (trunk, legs and arm) = 16 rad/s2, so 15 rad/s2 about every axis. Vertically 3 m/s2: the legs
# unload to 70 % at most, so the trunk cannot dive. At 3 m/s2 and 10 rad/s2 the trunk could not follow the four
# dev tables, whose pushed face starts at up to 1 m/s within a frame (R027b dry runs).
base_speed_limit: {linear_mps: [1.0, 1.0, 0.3], angular_radps: 1.0}
base_accel_limit: {linear_mps2: [5.0, 5.0, 3.0], angular_radps2: 15.0}
# Joint speeds. B2 legs: the B2 URDF's <limit velocity> (unitreerobotics/unitree_ros,
# robots/b2_description/urdf/b2_description.urdf): hip and thigh 23 rad/s, calf 14 rad/s. Z1 Pro: 180 deg/s on all six
# joints (product sheet; the same limit as the learned line's evaluation). No joint acceleration limit: the arm is
# what has to arrive in time.
speed_limit_rad_s: {FL_hip_joint: 23.0, FL_thigh_joint: 23.0, FL_calf_joint: 14.0,
                    FR_hip_joint: 23.0, FR_thigh_joint: 23.0, FR_calf_joint: 14.0,
                    RL_hip_joint: 23.0, RL_thigh_joint: 23.0, RL_calf_joint: 14.0,
                    RR_hip_joint: 23.0, RR_thigh_joint: 23.0, RR_calf_joint: 14.0,
                    joint1: 3.1416, joint2: 3.1416, joint3: 3.1416, joint4: 3.1416, joint5: 3.1416, joint6: 3.1416}

# The space under the belly counts as body for the object (R027: a box or a bin between the four legs, the trunk
# 0.13 m from its centre while the human stood 0.50 m away). A virtual box on the trunk: the footprint inside the
# four hips (thigh joints at x +-0.328 m, y +-0.192 m), from the trunk's underside (z = -0.075 m) down to the floor at
# the nominal height (z = -0.5435 m). Sampled as a volume grid: a small object can sit wholly inside the box.
under_body: {body: base_link, center: [0.0, 0.0, -0.30925], half_size: [0.328, 0.192, 0.23425], spacing_m: 0.08}

tool:                         # the same conventions as configs/b2z1.yaml `tool` (checked by a test)
  body: gripperStator
  contact_point: [0.149, 0.0, 0.0]   # r_c, on the mover's front face
  approach_axis: [1.0, 0.0, 0.0]
  jaw_axis: [0.0, 0.0, 1.0]

# Dog points of the correspondence (spec §4): a body and an offset in its frame, or the mean of bodies on the floor.
points:
  trunk: {body: base_link}
  trunk_front: {body: base_link, offset: [0.41, 0.0, 0.0]}
  z1_base: {body: link01}            # joint1
  z1_elbow: {body: link03}           # joint3
  gripper: {body: gripperStator, offset: [0.149, 0.0, 0.0]}
  support: {mean_of: [FL_foot, FR_foot, RL_foot, RR_foot], on_floor: true}

collision:
  # Arm links from the first one fixed to the trunk, in chain order: links two or more apart may not touch
  # (neighbours share a joint and always do).
  arm_chain: [link00, link01, link02, link03, link04, link05, link06, gripperStator, gripperMover]
  tool: [gripperStator, gripperMover]   # may touch the object (the front face pushes)
  leg_bodies: [FL_hip, FL_thigh, FL_calf, FR_hip, FR_thigh, FR_calf, RL_hip, RL_thigh, RL_calf,
               RR_hip, RR_thigh, RR_calf]
