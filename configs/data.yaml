# Dataset locations. Nothing here is committed to git; each entry is read from its env var,
# falling back to the default path (symlinks are fine).

omomo_raw:
  env_var: OMOMO_RAW_ROOT
  default: ~/CS6758Project/data/omomo_raw       # original OMOMO release files (*.p, captured_objects/)
omomo_new:
  env_var: OMOMO_NEW_ROOT
  default: ~/CS6758Project/data/omomo_new       # processed OMOMO_new (*.pt), format checked in R002
smplx_models:
  env_var: SMPLX_MODEL_ROOT
  default: ~/CS6758Project/data/smplx_models    # SMPL-X model files (licensed download)
