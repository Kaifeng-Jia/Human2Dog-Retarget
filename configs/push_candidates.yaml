# Pilot push segments (spec §7.1 step 1), shared by both lines: the first reachability diagnostic. prepare_tasks.py
# always builds them (marked confirmed); reach_diag.py --tasks-csv evaluates the other candidates.
# Frames are [start, end) at the clip's 30 fps after the adapter drops OMOMO_new's all-zero first frame.
#
# No segment in OMOMO_new or FORCE has a right-hand approach within 30 deg of the face normal (people bring the hand
# down from above), and single-hand pushes of low boxes are mostly on the top face. The diagnostic therefore uses
# the contact frames for IK; approach and retreat are "not covered by the current path template" (spec §5.2).
segments:
  - id: trashcan_side
    dataset: omomo_new
    clip: sub6_trashcan_003
    file: sub6_trashcan_003.pt
    file_sha256_16: 37b174f07624c5b0
    object: trashcan
    frames: [24, 160]          # 0.80-5.33 s
    face: side                 # tilt from vertical 4.8 deg
    contact_z_m: 0.14
    object_moves_m: 2.23
    approach_retreat_deg: [74.3, 45.3]
    mode: R                    # virtual hand (spec §5.1)
  - id: smallbox_top
    dataset: omomo_new
    clip: sub7_smallbox_041
    file: sub7_smallbox_041.pt
    file_sha256_16: 24e7d6ed5214bb4d
    object: smallbox
    frames: [41, 120]          # 1.37-4.00 s
    face: top                  # tilt from vertical 84.1 deg
    contact_z_m: 0.17
    object_moves_m: 1.83
    approach_retreat_deg: [30.8, 24.5]
    mode: R                    # virtual hand (spec §5.1)
  - id: largebox_top
    dataset: omomo_new
    clip: sub7_largebox_041
    file: sub7_largebox_041.pt
    file_sha256_16: e943acd237adbd7d
    object: largebox
    frames: [35, 120]          # 1.17-4.00 s
    face: top                  # tilt from vertical 87.4 deg
    contact_z_m: 0.36
    object_moves_m: 1.60
    approach_retreat_deg: [42.3, 31.6]
    mode: R                    # virtual hand (spec §5.1)
