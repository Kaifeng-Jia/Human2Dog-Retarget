[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2d"
version = "0.1.0"
description = "Human2Dog: functional interaction retargeting from human-object demonstrations to a B2-Z1 quadruped manipulator"
requires-python = ">=3.10,<3.12"
# Kinematics and collision use MuJoCo directly; torch is only needed inside X-Morph inference.
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "mujoco>=3.1",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["h2d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
